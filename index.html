<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" sizes="32x32" href="/src/assets/brand/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/src/assets/brand/apple-touch-icon.png" />
    <title>Lumen · Local Music Player</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("lumen.theme");
          var dark = t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
