name: Cloud client test packages
on:
  workflow_dispatch:
  push:
    branches: [main, "codex/cloud-clients"]
  pull_request:
    paths: ['src/**', 'desktop/**', 'android/**', 'config/**', 'package*.json', 'tools/stage-client.mjs', '.github/workflows/clients.yml']
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run desktop:setup
      - run: npm run typecheck && npm run test:client && npm run build
      - run: npm run test:desktop
      - if: runner.os == 'Windows'
        run: npm run build:win
      - if: runner.os == 'macOS'
        run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-${{ runner.os }}-unsigned-test
          path: |
            release/*.exe
            release/*.dmg
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --ignore-scripts
      - run: npm run typecheck && npm run android:sync
      - run: chmod +x android/gradlew && android/gradlew -p android testDebugUnitTest assembleDebug lintDebug --no-daemon
      - name: Store build checks (not a release APK)
        uses: actions/upload-artifact@v4
        with:
          name: Android-build-verification
          path: android/app/build/reports/tests/
      - name: Build APK with the fixed release key
        if: github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE_BASE64: ${{ secrets.LUMEN_ANDROID_KEYSTORE_BASE64 }}
          LUMEN_ANDROID_STORE_PASSWORD: ${{ secrets.LUMEN_ANDROID_STORE_PASSWORD }}
          LUMEN_ANDROID_KEY_ALIAS: ${{ secrets.LUMEN_ANDROID_KEY_ALIAS }}
          LUMEN_ANDROID_KEY_PASSWORD: ${{ secrets.LUMEN_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Fixed Android release signing key is required. No release APK produced.'; exit 1; }
          export LUMEN_ANDROID_KEYSTORE="$RUNNER_TEMP/lumen-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$LUMEN_ANDROID_KEYSTORE"
          trap 'rm -f "$LUMEN_ANDROID_KEYSTORE"' EXIT
          android/gradlew -p android assembleRelease --no-daemon
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-Android-fixed-signature
          path: android/app/build/outputs/apk/release/*release.apk
          if-no-files-found: error
