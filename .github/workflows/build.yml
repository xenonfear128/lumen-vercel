name: Build Lumen
on:
  workflow_dispatch:
  push:
    branches: [main, vercel]
  pull_request:
jobs:
  vercel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:vercel
      - run: npm run test:vercel
      - run: npm run test:vercel:bundle
      - run: npx playwright install --with-deps chromium
      - run: npm run test:fonts
      - run: npm run test:vercel:browser
      - run: npm run test:login
      - run: npm run test:library
      - run: npm run test:managed
      - run: npm run test:managed
        env:
          LUMEN_TEST_VERCEL: '1'
      - run: npm run test:cloud
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck && npm run build && npm run test:server
      - run: npx playwright install --with-deps chromium
      - run: npm run test:fonts
      - run: npm run test:login
      - run: npm run test:library
      - run: npm run test:managed && npm run test:cloud && npm run test:site
      - run: npm run test:linux
      - run: npm run build:linux
      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-Linux-server
          path: release/*.tar.gz
